    <script>
      (() => {
        let checkingForUpdate = false;

        async function checkForUpdate() {
          if (checkingForUpdate || document.visibilityState === "hidden") return;
          checkingForUpdate = true;
          try {
            const currentScript = document
              .querySelector('script[type="module"]')
              ?.getAttribute("src");
            const response = await fetch(`/?update-check=${Date.now()}`, {
              cache: "no-store",
            });
            if (!response.ok) return;
            const latestPage = new DOMParser().parseFromString(
              await response.text(),
              "text/html",
            );
            const latestScript = latestPage
              .querySelector('script[type="module"]')
              ?.getAttribute("src");
            if (currentScript && latestScript && currentScript !== latestScript) {
              window.location.reload();
            }
          } catch {
            // Stay on the current version when the device is offline.
          } finally {
            checkingForUpdate = false;
          }
        }

        window.addEventListener("focus", checkForUpdate);
        window.addEventListener("pageshow", checkForUpdate);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") checkForUpdate();
        });
        window.setInterval(checkForUpdate, 5 * 60 * 1000);
      })();
    </script>
